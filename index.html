<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>系統設計的安全議題</title>

  <style>
    /* =========================
       基本設定
    ========================= */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        "Noto Sans TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;

      color: #1e293b;

      background:
        linear-gradient(
          135deg,
          #eef6ff,
          #f8fafc,
          #ecfdf5
        );

      min-height: 100vh;
    }

    /* =========================
       Header
    ========================= */
    header {
      padding: 50px 20px 40px;

      text-align: center;

      color: white;

      background:
        linear-gradient(
          135deg,
          #1e3a8a,
          #2563eb,
          #0f766e
        );
    }

    header h1 {
      margin: 0 0 15px;

      font-size: clamp(30px, 5vw, 46px);
    }

    header p {
      margin: auto;

      max-width: 800px;

      line-height: 1.8;

      font-size: 17px;

      opacity: 0.95;
    }

    /* =========================
       主內容
    ========================= */
    main {
      max-width: 1200px;

      margin: auto;

      padding: 30px 20px 60px;
    }

    /* =========================
       說明區
    ========================= */
    .intro {
      padding: 20px;

      margin-bottom: 25px;

      background: rgba(255, 255, 255, 0.9);

      border: 1px solid #dbe3ef;

      border-radius: 16px;

      box-shadow:
        0 10px 30px rgba(15, 23, 42, 0.08);
    }

    .intro strong {
      color: #2563eb;
    }

    /* =========================
       工具列
    ========================= */
    .toolbar {
      display: flex;

      gap: 12px;

      margin-bottom: 25px;

      flex-wrap: wrap;
    }

    .search {
      flex: 1;

      min-width: 250px;

      padding: 13px 16px;

      border: 1px solid #cbd5e1;

      border-radius: 10px;

      font-size: 16px;

      outline: none;
    }

    .search:focus {
      border-color: #2563eb;

      box-shadow:
        0 0 0 3px #dbeafe;
    }

    button {
      border: none;

      border-radius: 10px;

      padding: 12px 18px;

      cursor: pointer;

      font-size: 15px;

      font-weight: bold;

      transition: 0.2s;
    }

    .btn-primary {
      color: white;

      background: #2563eb;
    }

    .btn-primary:hover {
      background: #1d4ed8;

      transform: translateY(-2px);
    }

    .btn-secondary {
      color: #334155;

      background: #e2e8f0;
    }

    .btn-secondary:hover {
      background: #cbd5e1;
    }

    /* =========================
       卡片 Grid
    ========================= */
    .grid {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 18px;
    }

    /* =========================
       卡片
    ========================= */
    .card {
      overflow: hidden;

      background: white;

      border:
        1px solid #dbe3ef;

      border-radius: 16px;

      box-shadow:
        0 10px 30px rgba(15, 23, 42, 0.08);

      transition: 0.25s;
    }

    .card:hover {
      transform: translateY(-4px);

      box-shadow:
        0 15px 35px rgba(15, 23, 42, 0.14);
    }

    /* =========================
       卡片標題
    ========================= */
    .card-title {
      width: 100%;

      min-height: 100px;

      padding: 18px;

      text-align: left;

      color: #1e293b;

      background: #e7f0fa;

      border-radius: 0;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: flex-start;
    }

    .card-title:hover {
      background: #dbeafe;

      color: #1d4ed8;
    }

    .english {
      font-size: 18px;

      font-weight: bold;

      line-height: 1.4;
    }

    .chinese {
      margin-top: 7px;

      color: #64748b;

      font-size: 14px;
    }

    /* =========================
       詳細內容
    ========================= */
    .details {
      display: none;

      padding: 20px;

      line-height: 1.8;

      border-top:
        1px solid #dbe3ef;

      background: white;
    }

    .card.open .details {
      display: block;
    }

    .details h3 {
      margin:
        0 0 8px;

      color: #2563eb;

      font-size: 16px;
    }

    .details p {
      margin:
        0 0 15px;
    }

    .details ul {
      margin-top: 5px;

      padding-left: 22px;
    }

    .tag {
      display: inline-block;

      margin-top: 10px;

      padding: 5px 10px;

      color: #1d4ed8;

      background: #eff6ff;

      border-radius: 20px;

      font-size: 12px;

      font-weight: bold;
    }

    /* =========================
       搜尋不到結果
    ========================= */
    .empty {
      display: none;

      padding: 50px;

      text-align: center;

      color: #64748b;

      font-size: 18px;
    }

    /* =========================
       Footer
    ========================= */
    footer {
      padding: 25px;

      text-align: center;

      color: #64748b;

      font-size: 14px;
    }

    /* =========================
       RWD
    ========================= */
    @media (max-width: 950px) {

      .grid {
        grid-template-columns:
          repeat(2, 1fr);
      }

    }

    @media (max-width: 600px) {

      .grid {
        grid-template-columns: 1fr;
      }

      main {
        padding:
          20px 12px 40px;
      }

      header {
        padding:
          35px 15px;
      }

    }
  </style>
</head>


<body>

  <!-- =========================
       標題
  ========================= -->

  <header>

    <h1>
      系統設計的安全議題
    </h1>

    <p>
      Why Consider Security in Program Development？
      <br>
      點擊下方的安全名詞，即可查看詳細說明、實際例子與重要觀念。
    </p>

  </header>


  <main>

    <!-- =========================
         使用說明
    ========================= -->

    <div class="intro">

      <strong>💡 使用方式：</strong>

      點擊任何一個安全名詞，
      即可展開或收合詳細內容。

      <br>

      也可以使用搜尋功能，
      快速找到想了解的名詞。

    </div>


    <!-- =========================
         搜尋與按鈕
    ========================= -->

    <div class="toolbar">

      <input
        id="search"
        class="search"
        type="search"
        placeholder="搜尋，例如：Encryption、加密、權限..."
      >

      <button
        id="openAll"
        class="btn-primary"
      >
        全部展開
      </button>

      <button
        id="closeAll"
        class="btn-secondary"
      >
        全部收合
      </button>

    </div>


    <!-- =========================
         卡片區域
    ========================= -->

    <section
      id="grid"
      class="grid"
    ></section>


    <div
      id="empty"
      class="empty"
    >
      找不到符合的安全名詞。
    </div>

  </main>


  <footer>

    資訊安全學習網站
    © 2026

  </footer>


  <script>

    /*
     * ==========================================
     * 資安名詞資料
     * ==========================================
     */

    const terms = [

      {
        en: "Communication Security",
        zh: "通訊安全",

        definition:
          "保護系統在網路或其他通訊媒介中傳輸的資料，避免資料被竊聽、竄改、偽造或中斷。",

        example:
          "例如網站使用 HTTPS / TLS 保護瀏覽器與伺服器之間的資料傳輸。",

        points: [
          "保護傳輸中的資料",
          "降低竊聽與竄改風險",
          "常搭配 TLS、VPN 等技術"
        ],

        tag: "傳輸安全"
      },


      {
        en: "Access Control",
        zh: "存取控制",

        definition:
          "決定誰可以存取哪些資源，以及使用者可以對這些資源進行哪些操作。",

        example:
          "例如一般員工只能查看自己的資料，而管理員才能修改系統設定。",

        points: [
          "確認使用者身分",
          "決定使用者權限",
          "遵循最小權限原則",
          "常見模型包括 RBAC、ABAC"
        ],

        tag: "權限管理"
      },


      {
        en: "Information Confidentiality",
        zh: "資訊機密性",

        definition:
          "確保資訊只能被經過授權的人員或系統查看，避免敏感資訊遭到未授權揭露。",

        example:
          "例如薪資資料、密碼與個人資料不應讓沒有權限的使用者查看。",

        points: [
          "限制資訊揭露",
          "保護敏感資料",
          "常使用加密技術",
          "需要同時注意儲存與傳輸"
        ],

        tag: "CIA 三要素"
      },


      {
        en: "Authenticity & Accountability",
        zh: "真實性與可追溯性",

        definition:
          "真實性是確認資料、使用者或來源是否可信；可追溯性則是確認某個行為由誰執行。",

        example:
          "使用者修改資料後，系統記錄他的帳號、時間與操作內容。",

        points: [
          "確認資料來源",
          "確認使用者身分",
          "追蹤使用者操作",
          "建立責任歸屬"
        ],

        tag: "身分與責任"
      },


      {
        en: "Non-repudiation",
        zh: "不可否認性",

        definition:
          "讓參與者事後難以否認自己曾經發送、簽署或執行某項行為。",

        example:
          "數位簽章可以協助證明某份電子文件確實由特定私鑰持有者簽署。",

        points: [
          "常使用數位簽章",
          "強調事後舉證能力",
          "常見於電子交易",
          "也適用於重要電子文件"
        ],

        tag: "證據性"
      },


      {
        en: "Audit Trail",
        zh: "稽核軌跡／稽核記錄",

        definition:
          "系統所留下的操作與事件紀錄，用來追蹤誰在什麼時間做了什麼事情。",

        example:
          "例如記錄管理員登入時間、修改設定的內容以及來源 IP。",

        points: [
          "協助事件調查",
          "支援內部稽核",
          "支援法規要求",
          "日誌本身也需要防竄改"
        ],

        tag: "紀錄與追蹤"
      },


      {
        en: "Business Continuity",
        zh: "業務持續性",

        definition:
          "即使發生故障、災害或資安事件，也能維持或迅速恢復重要業務。",

        example:
          "例如主要伺服器故障時，自動切換到備援伺服器，讓服務繼續運作。",

        points: [
          "建立備援系統",
          "降低服務中斷時間",
          "建立災害復原計畫",
          "建立事件應變流程"
        ],

        tag: "持續營運"
      },


      {
        en: "Encryption",
        zh: "加密",

        definition:
          "利用加密演算法與金鑰，將原本可讀的資料轉換成無法直接理解的形式。",

        example:
          "例如網站使用 HTTPS 加密瀏覽器與伺服器之間傳輸的資料。",

        points: [
          "保護敏感資料",
          "可以保護傳輸中的資料",
          "也可以保護儲存中的資料",
          "包含對稱式與非對稱式加密"
        ],

        tag: "資料保護"
      },


      {
        en: "Against Attack",
        zh: "防範攻擊",

        definition:
          "透過技術、流程與監控機制，降低系統遭受惡意攻擊的可能性與影響。",

        example:
          "例如使用防火牆、輸入驗證、漏洞修補與入侵偵測來降低攻擊風險。",

        points: [
          "降低攻擊面",
          "修補系統漏洞",
          "使用防火牆與安全設備",
          "持續監控異常行為"
        ],

        tag: "威脅防禦"
      },


      {
        en: "Compliance",
        zh: "法規遵循／合規性",

        definition:
          "確保系統、流程與資料處理符合適用的法律、法規、產業標準或組織政策。",

        example:
          "例如處理個人資料的系統，需要依照適用的個人資料保護規範進行設計。",

        points: [
          "確認適用的法規",
          "符合組織政策",
          "保存必要的紀錄",
          "定期進行稽核"
        ],

        tag: "治理"
      },


      {
        en: "Backup",
        zh: "備份",

        definition:
          "將重要資料建立額外副本，在資料遺失、設備故障、災害或資安事件後，可以使用備份進行資料恢復。",

        example:
          "例如每天自動備份資料庫，並將備份保存到另一個儲存位置。",

        points: [
          "建立備份策略",
          "定期執行備份",
          "保留不同時間點的版本",
          "定期測試資料還原"
        ],

        tag: "資料復原"
      },


      {
        en: "…",
        zh: "其他安全議題",

        definition:
          "圖片中的省略號表示還有許多其他安全議題可以納入系統設計。",

        example:
          "例如資料完整性、漏洞管理、事件應變、安全開發生命週期等。",

        points: [
          "資安不是單一功能",
          "需要從需求階段開始考慮",
          "設計、開發、測試與維運都需要注意安全"
        ],

        tag: "延伸概念"
      }

    ];


    /*
     * ==========================================
     * 取得 HTML 元素
     * ==========================================
     */

    const grid =
      document.getElementById("grid");

    const empty =
      document.getElementById("empty");

    const search =
      document.getElementById("search");


    /*
     * ==========================================
     * 建立卡片
     * ==========================================
     */

    function render(filter = "") {

      const keyword =
        filter
          .trim()
          .toLowerCase();


      const filtered =
        terms.filter(term => {

          const content = `
            ${term.en}
            ${term.zh}
            ${term.definition}
            ${term.example}
          `.toLowerCase();

          return content.includes(keyword);

        });


      /*
       * 清空原本內容
       */

      grid.innerHTML = "";


      /*
       * 產生卡片
       */

      filtered.forEach(term => {

        const card =
          document.createElement("article");

        card.className = "card";


        card.innerHTML = `

          <button class="card-title">

            <span class="english">
              ${term.en}
            </span>

            <span class="chinese">
              ${term.zh}
            </span>

          </button>


          <div class="details">

            <h3>
              💡 意思
            </h3>

            <p>
              ${term.definition}
            </p>


            <h3>
              📌 實際例子
            </h3>

            <p>
              ${term.example}
            </p>


            <h3>
              🔎 重點
            </h3>

            <ul>

              ${term.points
                .map(point =>
                  `<li>${point}</li>`
                )
                .join("")}

            </ul>


            <span class="tag">
              ${term.tag}
            </span>

          </div>

        `;


        /*
         * 點擊標題
         */

        const title =
          card.querySelector(".card-title");


        title.addEventListener(
          "click",
          () => {

            card.classList.toggle("open");

          }
        );


        grid.appendChild(card);

      });


      /*
       * 搜尋結果
       */

      if (filtered.length === 0) {

        empty.style.display =
          "block";

      } else {

        empty.style.display =
          "none";

      }

    }


    /*
     * ==========================================
     * 搜尋功能
     * ==========================================
     */

    search.addEventListener(
      "input",
      function () {

        render(this.value);

      }
    );


    /*
     * ==========================================
     * 全部展開
     * ==========================================
     */

    document
      .getElementById("openAll")
      .addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(".card")
            .forEach(card => {

              card.classList.add("open");

            });

        }
      );


    /*
     * ==========================================
     * 全部收合
     * ==========================================
     */

    document
      .getElementById("closeAll")
      .addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(".card")
            .forEach(card => {

              card.classList.remove("open");

            });

        }
      );


    /*
     * ==========================================
     * 初始載入
     * ==========================================
     */

    render();

  </script>

</body>
</html>
